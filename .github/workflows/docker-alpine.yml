name: Docker-Builder-Alpine

on:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  prepare:
    # Images are built from a release tag only (a release, or a manual run started on a tag: gh workflow run -r <tag>)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Run Translations
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
      - name: Run translate.js (ignore errors)
        run: node translate.js || true
        working-directory: translate
      - name: Run translate extractall
        run: node translate extractall
        working-directory: translate
      - name: Run translate.js minifyall
        run: node translate.js minifyall
        working-directory: translate
      - name: Run translate.js translateall
        run: node translate.js translateall
        working-directory: translate
      - name: Upload repo with translations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo-with-preparations
          path: ./
  build-images:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - variant: mongodb
            suffix: -mongodb
            postgresql: false
            mongodb: true
            mariadb: false
          - variant: postgresql
            suffix: -postgresql
            postgresql: true
            mongodb: false
            mariadb: false
          - variant: mariadb
            suffix: -mariadb
            postgresql: false
            mongodb: false
            mariadb: true
          - variant: complete
            suffix:
            postgresql: true
            mongodb: true
            mariadb: true
          - variant: slim
            suffix: -slim
            postgresql: false
            mongodb: false
            mariadb: false
    name: Build Docker Image (${{ matrix.variant }})
    steps:
      - name: Download repo artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repo-with-preparations
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: compile metadata information
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/meshcentral
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=ref,event=tag,suffix=${{ matrix.suffix }}
            type=raw,value=latest,enable=${{startsWith(github.ref, 'refs/tags/') && matrix.variant != 'complete'}},suffix=${{ matrix.suffix }}
            type=raw,value=latest,enable=${{startsWith(github.ref, 'refs/tags/') && matrix.variant == 'complete'}}
      - name: Build and push Docker image (${{ matrix.variant }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: ${{ github.event_name != 'pull_request' }}
          context: .
          file: ./docker/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          build-args: |
            DISABLE_MINIFY=yes
            DISABLE_TRANSLATE=yes
            DISABLE_EXTRACT=yes
            INCLUDE_MONGODB_TOOLS=${{ matrix.mongodb }}
            INCLUDE_POSTGRESQL_TOOLS=${{ matrix.postgresql }}
            INCLUDE_MARIADB_TOOLS=${{ matrix.mariadb }}
  rerun-on-failure:
    needs: build-images
    if: failure() && fromJSON(github.run_attempt) < 3
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
          REF: ${{ github.ref_name }}
        run: gh workflow run rerun.yaml -r "$REF" -F run_id=${{ github.run_id }}