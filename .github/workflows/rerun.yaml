name: Rerun failed workflow

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
permissions:
  actions: write # rerun the failed jobs of a run

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - name: rerun ${{ inputs.run_id }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
          RUN_ID: ${{ inputs.run_id }}
        run: |
          case "$RUN_ID" in (''|*[!0-9]*) echo "run_id must be a number" >&2; exit 1 ;; esac
          gh run watch "$RUN_ID" > /dev/null 2>&1
          gh run rerun "$RUN_ID" --failed