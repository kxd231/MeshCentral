name: Server release package

# Builds meshcentral-<version>.tgz (translated and minified pages, npm pack) from a release tag with
# tools/release/build-server-tgz.sh and puts it into a DRAFT release of that tag. The owner compares the hashes with
# a local build of the same tag and publishes the draft; published releases are immutable, so the package cannot be
# replaced afterwards (docs/fork-updates.md, "Making a release"). Runs when a version tag is pushed, or by hand for an
# existing tag whose release is not published yet.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-custom.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag without a published release, for example 1.3.1-custom.3'
        required: true

permissions:
  contents: write # create the draft release and upload the package

concurrency:
  group: server-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Release tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          # The version scheme of the fork: <upstream base>-custom.<n>, numbers without leading zeros
          if ! printf '%s\n' "$TAG" | grep -Eqx '(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})-custom\.[1-9][0-9]{0,5}'; then
            echo "Not a release tag of this fork: $TAG" >&2; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build the package
        run: tools/release/build-server-tgz.sh --check-agents "${{ steps.tag.outputs.tag }}" "refs/tags/${{ steps.tag.outputs.tag }}" out

      - name: Draft release with the package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          FILE: meshcentral-${{ steps.tag.outputs.tag }}.tgz
        run: |
          state=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = false ]; then
            echo "Release $TAG is already published; its package cannot be replaced." >&2; exit 1
          elif [ "$state" = true ]; then
            gh release upload "$TAG" "out/$FILE" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "out/$FILE" --draft --verify-tag --title "$TAG" \
              --notes "Draft made by the release workflow. Compare the package with a local build of the tag, write the notes and publish." -R "$GITHUB_REPOSITORY"
          fi
          {
            echo "## $FILE (draft release $TAG)"
            echo "- commit: $(git rev-parse HEAD)"
            echo "- size: $(stat -c %s "out/$FILE")"
            echo "- sha256: $(sha256sum "out/$FILE" | cut -d' ' -f1)"
            echo "- sha384: $(sha384sum "out/$FILE" | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
